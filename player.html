<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — SAT 1600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg:#ffffff; --bg-soft:#fafaf9; --border:#e4e4e7; --border-strong:#d4d4d8;
    --text:#18181b; --text-dim:#71717a; --text-faint:#a1a1aa; --accent:#4338ca; --accent-soft:#eef2ff;
    --gold:#b45309; --gold-soft:#fffbeb; --danger:#dc2626; --danger-soft:#fef2f2; --success:#16a34a; --success-soft:#f0fdf4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background: var(--bg-soft); color: var(--text); min-height:100vh; }
  h1,h2,h3{ font-family:'Plus Jakarta Sans','Inter',sans-serif; }
  a{ color:inherit; }

  .topbar{ background:white; border-bottom:1px solid var(--border); padding:14px 5%; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:50; }
  .back-link{ text-decoration:none; color:var(--text-dim); font-weight:600; font-size:.88rem; }
  .back-link:hover{ color:var(--text); }
  .title-block{ text-align:center; }
  .title-block h1{ font-size:1.05rem; font-weight:800; }
  .title-block .sub{ font-size:.75rem; color:var(--text-dim); }
  .score-chip{ font-size:.82rem; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:.4rem .8rem; border-radius:999px; }

  .progress-track{ height:4px; background:var(--border); }
  .progress-fill{ height:100%; background:var(--accent); transition:width .25s; }

  .wrap{ max-width:760px; margin:0 auto; padding:2rem 5% 4rem; }

  .qcard{ background:white; border:1px solid var(--border); border-radius:16px; padding:1.8rem; }
  .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
  .domain-tag{ font-size:.72rem; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:.3rem .7rem; border-radius:999px; }
  .qnum{ font-size:.8rem; color:var(--text-faint); font-weight:600; }
  .qimg{ max-width:100%; border:1px solid var(--border); border-radius:10px; margin-bottom:1.2rem; display:block; }
  .qstem{ font-size:1.08rem; font-weight:600; line-height:1.55; margin-bottom:1.4rem; }

  .choices{ display:flex; flex-direction:column; gap:.7rem; margin-bottom:1rem; }
  .choice{ display:flex; align-items:center; gap:.8rem; border:1px solid var(--border-strong); border-radius:10px;
    padding:.8rem 1rem; cursor:pointer; font-size:.98rem; transition:border-color .12s, background .12s; text-align:left; background:white; }
  .choice:hover{ border-color:var(--accent); }
  .choice .letter{ width:26px; height:26px; border-radius:50%; border:1px solid var(--border-strong); display:flex;
    align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:var(--text-dim); flex-shrink:0; }
  .choice.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .choice.selected .letter{ background:var(--accent); border-color:var(--accent); color:white; }
  .choice.correct{ border-color:var(--success); background:var(--success-soft); }
  .choice.correct .letter{ background:var(--success); border-color:var(--success); color:white; }
  .choice.incorrect{ border-color:var(--danger); background:var(--danger-soft); }
  .choice.incorrect .letter{ background:var(--danger); border-color:var(--danger); color:white; }

  .grid-input{ display:flex; align-items:center; gap:.8rem; margin-bottom:1rem; }
  .grid-input input{ flex:1; max-width:220px; padding:.8rem 1rem; border-radius:10px; border:1px solid var(--border-strong);
    font-size:1rem; font-family:inherit; }
  .grid-input input.correct{ border-color:var(--success); background:var(--success-soft); }
  .grid-input input.incorrect{ border-color:var(--danger); background:var(--danger-soft); }

  .feedback{ font-size:.88rem; font-weight:600; padding:.7rem 1rem; border-radius:10px; margin-bottom:1rem; display:none; }
  .feedback.show{ display:block; }
  .feedback.correct{ background:var(--success-soft); color:var(--success); }
  .feedback.incorrect{ background:var(--danger-soft); color:var(--danger); }

  .actions{ display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; gap:.8rem; }
  .btn{ padding:.75rem 1.4rem; border-radius:10px; border:none; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit; }
  .btn-ghost{ background:white; border:1px solid var(--border-strong); color:var(--text); }
  .btn-ghost:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--text); color:white; }
  .btn-primary:hover{ background:#000; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }

  .end-screen{ text-align:center; background:white; border:1px solid var(--border); border-radius:16px; padding:3rem 2rem; }
  .end-screen .big{ font-size:3rem; font-weight:800; color:var(--accent); font-family:'Plus Jakarta Sans'; }
  .end-screen h2{ font-size:1.4rem; margin:1rem 0 .5rem; }
  .end-screen p{ color:var(--text-dim); margin-bottom:1.6rem; }
  .breakdown{ text-align:left; max-width:360px; margin:0 auto 1.6rem; }
  .breakdown-row{ display:flex; justify-content:space-between; font-size:.88rem; padding:.4rem 0; border-bottom:1px solid var(--border); }

  .hidden{ display:none !important; }

  .topbar-actions{ display:flex; gap:.6rem; align-items:center; }
  .btn-small{ padding:.5rem .9rem; border-radius:8px; border:1px solid var(--border-strong); background:white; color:var(--text);
    font-weight:700; font-size:.8rem; cursor:pointer; font-family:inherit; }
  .btn-small:hover{ border-color:var(--accent); color:var(--accent); }

  .nav-overlay{ position:fixed; inset:0; background:rgba(24,24,27,.55); z-index:2000; display:flex;
    align-items:center; justify-content:center; padding:2rem; }
  .nav-panel{ background:white; border-radius:16px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:1.8rem; }
  .nav-panel h2{ font-size:1.15rem; margin-bottom:.3rem; }
  .nav-panel .nav-sub{ color:var(--text-dim); font-size:.85rem; margin-bottom:1.2rem; }
  .nav-module-label{ font-size:.78rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em;
    margin:1rem 0 .5rem; }
  .nav-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(42px,1fr)); gap:.5rem; }
  .nav-chip{ aspect-ratio:1; border-radius:8px; border:1.5px solid var(--border-strong); background:white; font-weight:700;
    font-size:.82rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .nav-chip.answered{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .nav-chip.current{ outline:2px solid var(--text); outline-offset:1px; }
  .nav-actions-row{ display:flex; justify-content:space-between; align-items:center; margin-top:1.6rem; gap:.8rem; }
  .nav-legend{ display:flex; gap:1rem; font-size:.78rem; color:var(--text-dim); margin-top:.8rem; }
  .nav-legend span{ display:flex; align-items:center; gap:.35rem; }
  .legend-dot{ width:12px; height:12px; border-radius:4px; border:1.5px solid var(--border-strong); display:inline-block; }
  .legend-dot.answered{ background:var(--accent-soft); border-color:var(--accent); }

  mark.hl{ background:#fef08a; border-radius:2px; padding:0 1px; cursor:pointer; }
  .hl-popup{ position:absolute; background:var(--text); color:white; font-size:.78rem; font-weight:700; padding:.4rem .7rem;
    border-radius:8px; cursor:pointer; z-index:100; display:none; box-shadow:0 8px 20px -6px rgba(0,0,0,.4); }

  .review-section{ text-align:left; max-width:560px; margin:1.6rem auto 0; }
  .review-toggle{ background:none; border:1px solid var(--border-strong); border-radius:8px; padding:.6rem 1rem; font-weight:700;
    font-size:.85rem; cursor:pointer; font-family:inherit; color:var(--text); width:100%; text-align:center; }
  .review-list{ margin-top:1rem; display:flex; flex-direction:column; gap:.8rem; }
  .review-item{ border:1px solid var(--border); border-radius:12px; padding:1rem; text-align:left; }
  .review-item .ri-meta{ display:flex; justify-content:space-between; font-size:.75rem; color:var(--text-dim); margin-bottom:.5rem; font-weight:600; }
  .review-item .ri-stem{ font-size:.92rem; margin-bottom:.6rem; }
  .review-item .ri-ans{ font-size:.85rem; }
  .review-item .ri-ans .wrong{ color:var(--danger); font-weight:700; }
  .review-item .ri-ans .right{ color:var(--success); font-weight:700; }

  .scaled-score{ font-size:1.1rem; color:var(--text-dim); margin-top:-.6rem; margin-bottom:1rem; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="#" id="backLink" class="back-link">← Back</a>
    <div class="title-block">
      <h1 id="titleText">Practice</h1>
      <div class="sub" id="subText">Loading…</div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn-small hidden" id="reviewBtn" onclick="openNav()">Review</button>
      <div class="score-chip" id="scoreChip">0 / 0</div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="wrap">
    <div class="qcard" id="qcard"></div>
    <div class="end-screen hidden" id="endScreen"></div>
  </div>

  <div class="nav-overlay hidden" id="navOverlay">
    <div class="nav-panel" id="navPanel"></div>
  </div>
  <div class="hl-popup" id="hlPopup">Highlight</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/qbank/questions.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'bank';
  const domainFilter = params.get('domain') || 'All';
  const difficultyFilter = params.get('difficulty') || 'All';
  const testNum = params.get('test');

  // --- Local progress store (per-browser today; swaps to Supabase once accounts land) ---
  const MockProgress = {
    key(n){ return `sat1600_mock_${n}`; },
    get(n){ try{ return JSON.parse(localStorage.getItem(this.key(n))); }catch(e){ return null; } },
    save(n, state){ try{ localStorage.setItem(this.key(n), JSON.stringify(state)); }catch(e){} },
    clear(n){ try{ localStorage.removeItem(this.key(n)); }catch(e){} }
  };

  function qKey(t, m, num){ return `${t}_${m}_${num}`; }

  let pool = [];
  let resumedFrom = null;
  let idx = 0;
  let userAnswers = [];
  let checkedState = [];
  let score = 0;
  let allSolved = false;
  let loggedInUser = null;
  let highlights = {}; // id -> [[start,end], ...]
  let pendingRange = null; // Range currently selected, awaiting highlight click

  const SCORE_CURVE = [ [0,200],[10,300],[20,350],[30,400],[40,450],[50,500],[60,560],[70,620],[80,680],[90,740],[95,780],[100,800] ];
  function scaledScore(pct){
    for(let i=0;i<SCORE_CURVE.length-1;i++){
      const [p0,s0]=SCORE_CURVE[i], [p1,s1]=SCORE_CURVE[i+1];
      if(pct>=p0 && pct<=p1){
        return Math.round((s0 + (s1-s0)*(pct-p0)/(p1-p0))/10)*10;
      }
    }
    return 800;
  }

  function hlStorageKey(){ return mode==='mock' ? `sat1600_hl_mock_${testNum}` : 'sat1600_hl_bank'; }
  function loadHighlights(){
    try{ highlights = JSON.parse(localStorage.getItem(hlStorageKey())) || {}; }catch(e){ highlights = {}; }
  }
  function saveHighlights(){
    try{ localStorage.setItem(hlStorageKey(), JSON.stringify(highlights)); }catch(e){}
  }
  function qId(i){
    const q = pool[i];
    return mode==='mock' ? `${testNum}_${i}` : (q.qkey || `bank_${i}`);
  }
  function stemHtmlWithHighlights(rawStem, ranges){
    if(!ranges || !ranges.length) return escapeHtml(rawStem);
    const sorted = ranges.slice().sort((a,b)=>a[0]-b[0]);
    let html = '', pos = 0;
    sorted.forEach(([s,e])=>{
      if(s<pos || e<=s || e>rawStem.length) return;
      html += escapeHtml(rawStem.slice(pos, s));
      html += `<mark class="hl">${escapeHtml(rawStem.slice(s, e))}</mark>`;
      pos = e;
    });
    html += escapeHtml(rawStem.slice(pos));
    return html;
  }
  function offsetWithin(container, node, offset){
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let total = 0, n;
    while((n = walker.nextNode())){
      if(n === node) return total + offset;
      total += n.textContent.length;
    }
    return total;
  }
  function setupHighlightListener(){
    const stemEl = document.getElementById('qstem');
    if(!stemEl) return;
    stemEl.addEventListener('mouseup', ()=>{
      setTimeout(()=>{
        const sel = window.getSelection();
        const popup = document.getElementById('hlPopup');
        if(!sel || sel.isCollapsed || sel.rangeCount===0){ popup.style.display='none'; pendingRange=null; return; }
        const range = sel.getRangeAt(0);
        if(!stemEl.contains(range.commonAncestorContainer)){ popup.style.display='none'; return; }
        const startOffset = offsetWithin(stemEl, range.startContainer, range.startOffset);
        const endOffset = offsetWithin(stemEl, range.endContainer, range.endOffset);
        if(endOffset <= startOffset){ popup.style.display='none'; return; }
        pendingRange = [startOffset, endOffset];
        const rect = range.getBoundingClientRect();
        popup.style.left = (rect.left + window.scrollX) + 'px';
        popup.style.top = (rect.top + window.scrollY - 38) + 'px';
        popup.style.display = 'block';
      }, 5);
    });
    stemEl.addEventListener('click', (e)=>{
      if(e.target && e.target.classList && e.target.classList.contains('hl')){
        const id = qId(idx);
        const q = pool[idx];
        const clickedText = e.target.textContent;
        const list = highlights[id] || [];
        const startIdx = q.stem.indexOf(clickedText);
        highlights[id] = list.filter(r => !(startIdx>=0 && r[0]<=startIdx && r[1]>=startIdx+clickedText.length));
        saveHighlights();
        render();
      }
    });
  }
  document.addEventListener('mousedown', (e)=>{
    const popup = document.getElementById('hlPopup');
    if(popup && e.target !== popup) popup.style.display = 'none';
  });

  async function getSolvedKeySet(){
    if(!window.sbClient || !loggedInUser) return new Set();
    try{
      const { data, error } = await window.sbClient.from('solved_questions').select('question_key');
      if(error || !data) return new Set();
      return new Set(data.map(r => r.question_key));
    }catch(e){ return new Set(); }
  }

  async function init(){
    loadHighlights();
    const hlPopup = document.getElementById('hlPopup');
    if(hlPopup){
      hlPopup.onclick = ()=>{
        if(pendingRange){
          const id = qId(idx);
          highlights[id] = highlights[id] || [];
          highlights[id].push(pendingRange);
          saveHighlights();
          pendingRange = null;
          hlPopup.style.display = 'none';
          render();
        }
      };
    }
    if(mode === 'mock'){
      const rb = document.getElementById('reviewBtn');
      if(rb) rb.classList.remove('hidden');
    }
    // resolve the session ourselves rather than depending on auth.js's own (racy) timing
    if(window.sbClient){
      try{
        const { data } = await window.sbClient.auth.getSession();
        loggedInUser = data && data.session ? data.session.user : null;
      }catch(e){}
    }

    if(mode === 'mock' && testNum && QUESTIONS[testNum]){
      document.getElementById('backLink').href = 'mocks.html';
      document.getElementById('titleText').textContent = 'Mock Test ' + testNum;
      QUESTIONS[testNum].M1.forEach(q => pool.push({...q, module:'Module 1'}));
      QUESTIONS[testNum].M2.forEach(q => pool.push({...q, module:'Module 2'}));
      const saved = MockProgress.get(testNum);
      if(saved && saved.status === 'in_progress' && Array.isArray(saved.userAnswers) && saved.userAnswers.length === pool.length){
        resumedFrom = saved;
      }
    } else {
      document.getElementById('backLink').href = 'question-bank.html';
      document.getElementById('titleText').textContent = domainFilter === 'All' ? 'All Questions' : domainFilter;
      const solvedKeys = await getSolvedKeySet();
      let skippedSolved = 0;
      Object.keys(QUESTIONS).forEach(t=>{
        ['M1','M2'].forEach(m=>{
          QUESTIONS[t].M1 && QUESTIONS[t][m].forEach(q=>{
            const key = qKey(t, m, q.num);
            if((domainFilter === 'All' || q.domain === domainFilter) &&
               (difficultyFilter === 'All' || q.difficulty === difficultyFilter)){
              if(solvedKeys.has(key)){ skippedSolved++; return; }
              pool.push({...q, module:m, test:t, qkey:key});
            }
          });
        });
      });
      // shuffle for practice variety
      for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
      if(pool.length === 0 && skippedSolved > 0){
        allSolved = true;
      }
      pool = pool.slice(0, 60); // cap a practice session at 60 questions
    }

    document.getElementById('subText').textContent = allSolved
      ? 'All caught up here!'
      : `${pool.length} questions${mode==='mock' ? ' · Module 1 + Module 2' : ''}${difficultyFilter!=='All' ? ' · '+difficultyFilter : ''}`;

    idx = resumedFrom ? Math.min(resumedFrom.idx||0, pool.length-1) : 0;
    userAnswers = resumedFrom ? resumedFrom.userAnswers.slice() : new Array(pool.length).fill(null);
    checkedState = new Array(pool.length).fill(false);

    if(mode === 'mock' && testNum){
      saveMockProgress(); // marks it in_progress the moment the test is opened
      window.addEventListener('beforeunload', saveMockProgress);
    }

    if(allSolved){
      renderAllSolved();
    } else {
      render();
    }
  }

  function renderAllSolved(){
    document.getElementById('qcard').innerHTML = `
      <div style="text-align:center; padding:2rem 1rem;">
        <div style="font-size:2.4rem; margin-bottom:.8rem;">🎉</div>
        <h2 style="margin-bottom:.6rem;">You've solved every question here!</h2>
        <p style="color:var(--text-dim); margin-bottom:1.4rem;">Try a different domain or difficulty from the Question Bank.</p>
        <a href="question-bank.html" class="btn btn-primary" style="text-decoration:none; display:inline-block;">Back to Question Bank</a>
      </div>`;
  }

  function saveMockProgress(){
    if(mode !== 'mock' || !testNum) return;
    MockProgress.save(testNum, { status:'in_progress', idx, userAnswers, updatedAt: Date.now() });
  }

  function parseFraction(s){
    if(s==null) return null;
    s = String(s).trim();
    if(/^-?\d+\/\d+$/.test(s)){ const [n,d]=s.split('/').map(Number); return n/d; }
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function checkGrid(input, correctRaw){
    const accepted = String(correctRaw).split('|').map(s=>s.trim());
    const userNum = parseFraction(input);
    return accepted.some(a=>{
      const accNum = parseFraction(a);
      if(userNum!=null && accNum!=null) return Math.abs(userNum-accNum) < 1e-6;
      return input.trim() === a;
    });
  }

  function render(){
    const q = pool[idx];
    const card = document.getElementById('qcard');
    document.getElementById('progressFill').style.width = ((idx)/(pool.length))*100 + '%';
    document.getElementById('scoreChip').textContent = `${score} / ${pool.length}`;

    let html = `<div class="qmeta"><span class="domain-tag">${q.domain}${q.module ? ' · '+q.module : ''}${q.difficulty ? ' · '+q.difficulty : ''}</span><span class="qnum">Question ${idx+1} of ${pool.length}</span></div>`;
    if(q.images && q.images.length){
      q.images.forEach(src => { html += `<img class="qimg" src="${src}" alt="figure">`; });
    }
    html += `<div class="qstem" id="qstem">${stemHtmlWithHighlights(q.stem, highlights[qId(idx)])}</div>`;

    if(q.type === 'mc'){
      html += `<div class="choices" id="choicesWrap">`;
      ['A','B','C','D'].forEach(letter=>{
        const sel = userAnswers[idx] === letter ? 'selected' : '';
        html += `<button type="button" class="choice ${sel}" data-letter="${letter}" onclick="selectChoice('${letter}')">
          <span class="letter">${letter}</span><span>${escapeHtml(q.choices[letter])}</span></button>`;
      });
      html += `</div>`;
    } else {
      const val = userAnswers[idx] || '';
      html += `<div class="grid-input"><input type="text" id="gridInput" placeholder="Enter your answer" value="${val}" oninput="onGridInput(this.value)"></div>`;
    }

    html += `<div class="feedback" id="feedback"></div>`;
    html += `<div class="actions">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()" ${idx===0?'disabled':''}>← Previous</button>
        ${mode==='bank' ? `<button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>` : ''}
        <button class="btn btn-primary" id="nextBtn" onclick="nextQ()">${idx===pool.length-1 ? 'Finish' : 'Next →'}</button>
      </div>`;

    card.innerHTML = html;
    setupHighlightListener();

    if(mode === 'bank' && checkedState[idx]){
      showFeedback(true);
    }

    if(window.renderMathInElement){
      renderMathInElement(card, { delimiters: [{left:'$', right:'$', display:false}] });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function selectChoice(letter){
    if(mode==='bank' && checkedState[idx]) return;
    userAnswers[idx] = letter;
    document.querySelectorAll('.choice').forEach(el=>{
      el.classList.toggle('selected', el.dataset.letter === letter);
    });
    saveMockProgress();
  }
  function onGridInput(val){
    userAnswers[idx] = val;
    saveMockProgress();
  }

  function checkAnswer(){
    if(checkedState[idx]) return;
    const q = pool[idx];
    let isCorrect = false;
    if(q.type === 'mc'){
      isCorrect = userAnswers[idx] === String(q.answer);
      document.querySelectorAll('.choice').forEach(el=>{
        const letter = el.dataset.letter;
        if(letter === String(q.answer)) el.classList.add('correct');
        else if(letter === userAnswers[idx]) el.classList.add('incorrect');
      });
    } else {
      isCorrect = userAnswers[idx] != null && checkGrid(userAnswers[idx], q.answer);
      const inp = document.getElementById('gridInput');
      inp.classList.add(isCorrect ? 'correct' : 'incorrect');
    }
    if(isCorrect) score++;
    checkedState[idx] = true;
    checkedState.__correct = checkedState.__correct || {};
    checkedState.__correct[idx] = isCorrect;
    showFeedback(isCorrect, q.answer);
    document.getElementById('scoreChip').textContent = `${score} / ${pool.length}`;

    if(mode === 'bank' && isCorrect && q.qkey && window.sbClient && loggedInUser){
      window.sbClient.rpc('award_question_coin', { p_question_key: q.qkey, p_is_correct: true, p_domain: q.domain || null }).then(({data, error})=>{
        if(!error && data && data.awarded){
          if(window.currentUserProfile) window.currentUserProfile.coins = data.coins;
          if(window.updateNavCoinDisplay) window.updateNavCoinDisplay();
          if(window.sat1600Toast) window.sat1600Toast('🪙 +1 coin!', 1800);
        }
      }).catch(()=>{});
    }
  }

  function showFeedback(isCorrect, correctVal){
    const fb = document.getElementById('feedback');
    fb.classList.add('show', isCorrect ? 'correct' : 'incorrect');
    const cv = correctVal !== undefined ? correctVal : pool[idx].answer;
    fb.textContent = isCorrect ? '✓ Correct!' : `✗ Not quite. Correct answer: ${cv!=null && cv!=='' ? cv : 'N/A'}`;
  }

  function prevQ(){ if(idx>0){ idx--; saveMockProgress(); render(); } }
  function nextQ(){
    if(idx < pool.length-1){ idx++; saveMockProgress(); render(); }
    else if(mode === 'mock'){ openNav(); }
    else { showEnd(); }
  }

  function goToQuestion(i){
    idx = i;
    saveMockProgress();
    closeNav();
    render();
  }

  function buildNavHtml(){
    const answeredCount = userAnswers.filter(a => a!=null && a!=='').length;
    let body = '';
    if(mode === 'mock'){
      const m1 = pool.map((q,i)=>({q,i})).filter(x=>x.q.module==='Module 1');
      const m2 = pool.map((q,i)=>({q,i})).filter(x=>x.q.module==='Module 2');
      [['Module 1', m1], ['Module 2', m2]].forEach(([label, items])=>{
        if(!items.length) return;
        body += `<div class="nav-module-label">${label}</div><div class="nav-grid">`;
        items.forEach(({q,i})=>{
          const answered = userAnswers[i]!=null && userAnswers[i]!=='';
          body += `<button type="button" class="nav-chip ${answered?'answered':''} ${i===idx?'current':''}" onclick="goToQuestion(${i})">${i+1}</button>`;
        });
        body += `</div>`;
      });
    } else {
      body += `<div class="nav-grid">`;
      pool.forEach((q,i)=>{
        const answered = userAnswers[i]!=null && userAnswers[i]!=='';
        body += `<button type="button" class="nav-chip ${answered?'answered':''} ${i===idx?'current':''}" onclick="goToQuestion(${i})">${i+1}</button>`;
      });
      body += `</div>`;
    }
    return `
      <h2>Question Navigator</h2>
      <div class="nav-sub">${answeredCount} of ${pool.length} answered</div>
      ${body}
      <div class="nav-legend">
        <span><span class="legend-dot answered"></span> Answered</span>
        <span><span class="legend-dot"></span> Unanswered</span>
      </div>
      <div class="nav-actions-row">
        <button class="btn btn-ghost" onclick="closeNav()">← Back to Question</button>
        <button class="btn btn-primary" onclick="submitTest()">Submit ${mode==='mock' ? 'Test' : 'Session'}</button>
      </div>`;
  }

  function openNav(){
    document.getElementById('navPanel').innerHTML = buildNavHtml();
    document.getElementById('navOverlay').classList.remove('hidden');
  }
  function closeNav(){
    document.getElementById('navOverlay').classList.add('hidden');
  }
  function submitTest(){
    closeNav();
    showEnd();
  }

  function showEnd(){
    document.getElementById('qcard').classList.add('hidden');
    const end = document.getElementById('endScreen');
    end.classList.remove('hidden');
    document.getElementById('progressFill').style.width = '100%';

    let finalScore = score;
    if(mode === 'mock'){
      // in mock mode we didn't check per-question; grade everything now
      finalScore = 0;
      pool.forEach((q,i)=>{
        const a = userAnswers[i];
        if(a==null) return;
        if(q.type==='mc'){ if(a === String(q.answer)) finalScore++; }
        else { if(checkGrid(a, q.answer)) finalScore++; }
      });
    }
    const pct = Math.round((finalScore/pool.length)*100);
    const scaled = mode==='mock' ? scaledScore(pct) : null;

    if(mode === 'mock' && testNum){
      MockProgress.save(testNum, { status:'completed', score: finalScore, total: pool.length, pct, scaled, completedAt: Date.now() });
      window.removeEventListener('beforeunload', saveMockProgress);

      if(window.sbClient && loggedInUser){
        const m1Total = pool.filter(q=>q.module==='Module 1').length;
        const m2Total = pool.filter(q=>q.module==='Module 2').length;
        let m1ok=0, m2ok=0;
        pool.forEach((q,i)=>{
          const a = userAnswers[i]; if(a==null) return;
          const ok = q.type==='mc' ? a===String(q.answer) : checkGrid(a,q.answer);
          if(ok){ if(q.module==='Module 1') m1ok++; else m2ok++; }
        });
        window.sbClient.from('mock_attempts').insert({
          user_id: loggedInUser.id,
          test_num: testNum,
          raw_score: finalScore,
          total_questions: pool.length,
          scaled_score: scaled,
          module_breakdown: { module1:{correct:m1ok,total:m1Total}, module2:{correct:m2ok,total:m2Total} }
        }).then(()=>{}).catch(()=>{});
      }
    }

    let breakdownHtml = '';
    if(mode === 'mock'){
      const m1Count = pool.filter(q=>q.module==='Module 1').length;
      const m2Count = pool.filter(q=>q.module==='Module 2').length;
      let m1c=0,m2c=0;
      pool.forEach((q,i)=>{
        const a = userAnswers[i]; if(a==null) return;
        const ok = q.type==='mc' ? a===String(q.answer) : checkGrid(a,q.answer);
        if(ok){ if(q.module==='Module 1') m1c++; else m2c++; }
      });
      breakdownHtml = `<div class="breakdown">
        <div class="breakdown-row"><span>Module 1</span><span>${m1c} / ${m1Count}</span></div>
        <div class="breakdown-row"><span>Module 2</span><span>${m2c} / ${m2Count}</span></div>
      </div>`;
    } else {
      const domains = {};
      pool.forEach((q,i)=>{
        domains[q.domain] = domains[q.domain] || {correct:0, total:0};
        domains[q.domain].total++;
        const a = userAnswers[i];
        if(a!=null){
          const ok = q.type==='mc' ? a===String(q.answer) : checkGrid(a,q.answer);
          if(ok) domains[q.domain].correct++;
        }
      });
      breakdownHtml = '<div class="breakdown">' + Object.entries(domains).map(([d,v])=>
        `<div class="breakdown-row"><span>${d}</span><span>${v.correct} / ${v.total}</span></div>`).join('') + '</div>';
    }

    const wrongList = [];
    pool.forEach((q,i)=>{
      const a = userAnswers[i];
      const ok = a!=null && (q.type==='mc' ? a===String(q.answer) : checkGrid(a,q.answer));
      if(!ok) wrongList.push({q, i, given:a});
    });
    const reviewHtml = wrongList.length ? `
      <div class="review-section">
        <button type="button" class="review-toggle" onclick="document.getElementById('reviewList').classList.toggle('hidden')">
          Review ${wrongList.length} missed question${wrongList.length===1?'':'s'}
        </button>
        <div class="review-list hidden" id="reviewList">
          ${wrongList.map(({q,given})=>`
            <div class="review-item">
              <div class="ri-meta"><span>${q.domain}${q.module?' · '+q.module:''}</span><span>${q.difficulty||''}</span></div>
              <div class="ri-stem">${escapeHtml(q.stem)}</div>
              <div class="ri-ans">Your answer: <span class="wrong">${given!=null && given!=='' ? escapeHtml(String(given)) : '(blank)'}</span>
                &nbsp;·&nbsp; Correct: <span class="right">${q.answer!=null && q.answer!=='' ? escapeHtml(String(q.answer)) : 'N/A'}</span></div>
            </div>`).join('')}
        </div>
      </div>` : '';

    end.innerHTML = `
      <div class="big">${mode==='mock' ? scaled+' / 800' : pct+'%'}</div>
      ${mode==='mock' ? `<div class="scaled-score">Estimated score · ${pct}% correct</div>` : ''}
      <h2>${finalScore} / ${pool.length} correct</h2>
      <p>${mode==='mock' ? 'Mock test complete — here is how you did by module.' : 'Practice session complete — here is your breakdown by domain.'}</p>
      ${breakdownHtml}
      ${reviewHtml}
      <a href="${mode==='mock' ? 'mocks.html' : 'question-bank.html'}" class="btn btn-primary" style="text-decoration:none; display:inline-block; margin-top:1.2rem;">Back</a>
    `;
  }

  init();
</script>
</body>
</html>
