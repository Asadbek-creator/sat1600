<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — SAT 1600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --bg-soft:#fafaf9; --border:#e4e4e7; --border-strong:#d4d4d8;
    --text:#18181b; --text-dim:#71717a; --text-faint:#a1a1aa; --accent:#4338ca; --accent-soft:#eef2ff;
    --success:#16a34a; --success-soft:#f0fdf4; --danger:#dc2626; --gold:#b45309; --gold-soft:#fef3c7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background: var(--bg-soft); color: var(--text); min-height:100vh; }
  h1,h2{ font-family:'Plus Jakarta Sans','Inter',sans-serif; }
  .wrap{ max-width:920px; margin:0 auto; padding:4rem 5%; }
  .logo { font-weight:800; font-size:1.25rem; letter-spacing:-0.4px; text-decoration:none; color:var(--text); font-family:'Plus Jakarta Sans'; display:block; margin-bottom:2.5rem; }
  .logo span{ color:var(--accent); }
  .card{ background:white; border:1px solid var(--border); border-radius:16px; padding:2.2rem; margin-bottom:1.4rem; }
  .live-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--success); margin-right:.5rem;
    animation: pulse 1.6s infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .count-label{ color:var(--text-dim); font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:.6rem; }
  .count-value{ font-size:3.4rem; font-weight:800; font-family:'Plus Jakarta Sans'; letter-spacing:-1px; }
  .updated{ color:var(--text-faint); font-size:.8rem; margin-top:.8rem; }
  .locked{ text-align:center; padding:3rem 1rem; }
  .locked h2{ margin-bottom:.6rem; }
  .locked p{ color:var(--text-dim); }
  .locked button{ margin-top:1.4rem; background:var(--text); color:white; border:none; padding:.75rem 1.4rem;
    border-radius:10px; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit; }
  #appArea{ display:none; }
  .page-list{ list-style:none; margin-top:1rem; }
  .page-list li{ display:flex; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid var(--border); font-size:.88rem; }
  .page-list li:last-child{ border-bottom:none; }
  .page-list .cnt{ font-weight:700; color:var(--accent); }

  .card h2.section-title{ font-size:1.05rem; margin-bottom:1.2rem; }
  .search-box{ width:100%; padding:.7rem .9rem; border-radius:10px; border:1px solid var(--border-strong);
    font-size:.9rem; font-family:inherit; margin-bottom:1.2rem; }
  .search-box:focus{ outline:none; border-color:var(--accent); }
  table.users-table{ width:100%; border-collapse:collapse; font-size:.86rem; }
  table.users-table th{ text-align:left; color:var(--text-dim); font-weight:700; text-transform:uppercase;
    font-size:.72rem; letter-spacing:.3px; padding:.5rem .4rem; border-bottom:1px solid var(--border-strong); }
  table.users-table td{ padding:.65rem .4rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.users-table tr:last-child td{ border-bottom:none; }
  .role-badge{ display:inline-block; padding:.2rem .55rem; border-radius:999px; font-size:.72rem; font-weight:700; }
  .role-badge.student{ background:var(--bg-soft); color:var(--text-dim); border:1px solid var(--border-strong); }
  .role-badge.teacher{ background:var(--accent-soft); color:var(--accent); }
  .role-badge.super_admin{ background:var(--gold-soft); color:var(--gold); }
  .row-coins{ color:var(--gold); font-weight:700; }
  .row-btn{ border:1px solid var(--border-strong); background:white; color:var(--text); padding:.4rem .8rem;
    border-radius:8px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .row-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .row-btn.revoke{ color:var(--danger); }
  .row-btn.revoke:hover{ border-color:var(--danger); }
  .row-btn:disabled{ opacity:.5; cursor:default; }
  .empty-note{ color:var(--text-faint); font-size:.85rem; padding:1rem 0; }
  .stat-row{ display:flex; gap:2rem; margin-bottom:1.4rem; }
  .stat-mini .num{ font-size:1.6rem; font-weight:800; font-family:'Plus Jakarta Sans'; }
  .stat-mini .lbl{ font-size:.75rem; color:var(--text-dim); font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="logo">SAT<span>1600</span></a>

    <div id="lockedArea" class="card locked">
      <h2>Admin only</h2>
      <p>Log in with an admin account to view this page.</p>
      <button onclick="openModal('login')">Log in</button>
    </div>

    <div id="appArea">
      <div class="card">
        <div class="count-label"><span class="live-dot"></span>People on the site right now</div>
        <div class="count-value" id="liveCount">—</div>
        <div class="updated" id="updatedAt"></div>
      </div>
      <div class="card">
        <div class="count-label">By page</div>
        <ul class="page-list" id="pageList"></ul>
      </div>

      <div class="card" id="usersCard" style="display:none;">
        <h2 class="section-title">Foydalanuvchilar</h2>
        <div class="stat-row">
          <div class="stat-mini"><div class="num" id="statTotal">—</div><div class="lbl">Jami</div></div>
          <div class="stat-mini"><div class="num" id="statTeachers">—</div><div class="lbl">Ustozlar</div></div>
        </div>
        <input type="text" id="userSearch" class="search-box" placeholder="Email yoki ism bo'yicha qidirish...">
        <table class="users-table">
          <thead>
            <tr><th>Foydalanuvchi</th><th>Rol</th><th>Tanga</th><th>Qo'shildi</th><th></th></tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
        <div id="usersEmpty" class="empty-note" style="display:none;">Foydalanuvchi topilmadi.</div>
      </div>
    </div>
  </div>

  <!-- Login modal (reused from the rest of the site) -->
  <div class="modal-overlay" id="modalOverlay" style="position:fixed; inset:0; background:rgba(24,24,27,.4); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:2000;">
    <div class="modal" style="background:white; border:1px solid var(--border); border-radius:16px; padding:2.2rem; width:90%; max-width:380px; position:relative; box-shadow:0 30px 60px -20px rgba(0,0,0,.25);">
      <button class="modal-close" onclick="closeModal()" style="position:absolute; top:1.1rem; right:1.3rem; background:none; border:none; color:var(--text-faint); font-size:1.3rem; cursor:pointer;">&times;</button>
      <h3 id="modalTitle" style="font-size:1.3rem; margin-bottom:1.4rem; font-weight:700;">Log in</h3>
      <button type="button" class="btn-google" onclick="handleGoogleSignIn()" style="width:100%; display:flex; align-items:center; justify-content:center; gap:.6rem; background:#fff; border:1px solid #dcdfe4; border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.92rem; color:#1f1f1f; cursor:pointer; margin-bottom:1rem;">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div style="display:flex; align-items:center; gap:.75rem; margin-bottom:1rem;">
        <div style="flex:1; height:1px; background:#e5e7eb;"></div>
        <span style="font-size:.78rem; color:#9ca3af;">or</span>
        <div style="flex:1; height:1px; background:#e5e7eb;"></div>
      </div>
      <form onsubmit="return false;">
        <input type="text" id="modalNameField" placeholder="Full name" style="display:none; width:100%; padding:.75rem .9rem; margin-bottom:.9rem; border-radius:8px; border:1px solid var(--border-strong); font-size:.92rem; font-family:inherit;">
        <input type="email" id="modalEmailField" placeholder="Email address" autocomplete="email" style="width:100%; padding:.75rem .9rem; margin-bottom:.9rem; border-radius:8px; border:1px solid var(--border-strong); font-size:.92rem; font-family:inherit;">
        <input type="password" id="modalPasswordField" placeholder="Password" autocomplete="current-password" style="width:100%; padding:.75rem .9rem; margin-bottom:.9rem; border-radius:8px; border:1px solid var(--border-strong); font-size:.92rem; font-family:inherit;">
        <p id="modalError" style="display:none; color:var(--danger); font-size:.82rem; margin:-.4rem 0 .9rem;"></p>
        <button type="submit" id="modalSubmit" style="width:100%; background:var(--text); color:white; border:none; padding:.75rem 1.3rem; border-radius:10px; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit;">Log in</button>
      </form>
      <div class="modal-switch" style="text-align:center; margin-top:1.1rem; color:var(--text-dim); font-size:.88rem;">
        <span id="modalSwitchText">Don't have an account? <a onclick="openModal('signup')" style="color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600;">Sign up</a></span>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script>
  var pollTimer = null;
  var allUsers = [];
  var searchDebounce = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderPresence() {
    var ch = window.sat1600PresenceChannel;
    if (!ch) return;
    var state = ch.presenceState();
    var ids = Object.keys(state);
    document.getElementById('liveCount').textContent = ids.length;
    document.getElementById('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString();

    var byPage = {};
    ids.forEach(function (id) {
      var entries = state[id] || [];
      entries.forEach(function (e) {
        var p = e.page || 'unknown';
        byPage[p] = (byPage[p] || 0) + 1;
      });
    });
    var listEl = document.getElementById('pageList');
    var pages = Object.keys(byPage).sort(function (a, b) { return byPage[b] - byPage[a]; });
    if (!pages.length) {
      listEl.innerHTML = '<li style="color:var(--text-faint);">No one online right now.</li>';
    } else {
      listEl.innerHTML = pages.map(function (p) {
        return '<li><span>' + p + '</span><span class="cnt">' + byPage[p] + '</span></li>';
      }).join('');
    }
  }

  function roleLabel(role) {
    if (role === 'super_admin') return 'Katta admin';
    if (role === 'teacher') return 'Ustoz';
    return 'Talaba';
  }

  function renderUsers(list) {
    var body = document.getElementById('usersTableBody');
    var empty = document.getElementById('usersEmpty');
    if (!list.length) {
      body.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    body.innerHTML = list.map(function (u) {
      var name = u.full_name ? escapeHtml(u.full_name) : '<span style="color:var(--text-faint);">Ism yo\'q</span>';
      var joined = u.created_at ? new Date(u.created_at).toLocaleDateString() : '—';
      var actionHtml = '';
      if (u.role === 'student') {
        actionHtml = '<button class="row-btn" onclick="setRole(\'' + encodeURIComponent(u.email) + '\',\'teacher\',this)">Ustoz qilish</button>';
      } else if (u.role === 'teacher') {
        actionHtml = '<button class="row-btn revoke" onclick="setRole(\'' + encodeURIComponent(u.email) + '\',\'student\',this)">Ustozlikni bekor qilish</button>';
      } else {
        actionHtml = '<span style="color:var(--text-faint); font-size:.78rem;">—</span>';
      }
      return '<tr>' +
        '<td><div style="font-weight:600;">' + name + '</div><div style="color:var(--text-dim); font-size:.8rem;">' + escapeHtml(u.email) + '</div></td>' +
        '<td><span class="role-badge ' + u.role + '">' + roleLabel(u.role) + '</span></td>' +
        '<td class="row-coins">🪙 ' + (u.coins || 0) + '</td>' +
        '<td style="color:var(--text-dim);">' + joined + '</td>' +
        '<td>' + actionHtml + '</td>' +
        '</tr>';
    }).join('');
  }

  async function setRole(encodedEmail, newRole, btnEl) {
    var email = decodeURIComponent(encodedEmail);
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Kuting…'; }
    try {
      var res = await window.sbClient.rpc('admin_set_user_role', { target_email: email, new_role: newRole });
      if (res.error) throw res.error;
      var u = allUsers.find(function (x) { return x.email === email; });
      if (u) u.role = newRole;
      applySearchFilter();
      if (window.sat1600Toast) window.sat1600Toast((newRole === 'teacher' ? '✅ Ustoz qilib tayinlandi' : 'Talaba roliga qaytarildi') + ': ' + email);
    } catch (err) {
      if (window.sat1600Toast) window.sat1600Toast('Xatolik: ' + ((err && err.message) || 'nomalum xatolik'));
      if (btnEl) btnEl.disabled = false;
      renderUsers(allUsers);
    }
  }
  window.setRole = setRole;

  function applySearchFilter() {
    var q = (document.getElementById('userSearch').value || '').trim().toLowerCase();
    var filtered = !q ? allUsers : allUsers.filter(function (u) {
      return (u.email && u.email.toLowerCase().indexOf(q) !== -1) ||
             (u.full_name && u.full_name.toLowerCase().indexOf(q) !== -1);
    });
    renderUsers(filtered);
  }

  async function loadUsers() {
    try {
      var res = await window.sbClient.from('profiles')
        .select('id,email,full_name,role,coins,created_at')
        .order('created_at', { ascending: false })
        .limit(500);
      if (res.error) throw res.error;
      allUsers = res.data || [];
      document.getElementById('statTotal').textContent = allUsers.length;
      document.getElementById('statTeachers').textContent = allUsers.filter(function (u) { return u.role === 'teacher'; }).length;
      applySearchFilter();
    } catch (err) {
      document.getElementById('usersTableBody').innerHTML = '';
      document.getElementById('usersEmpty').textContent = 'Yuklashda xatolik: ' + ((err && err.message) || 'nomalum xatolik');
      document.getElementById('usersEmpty').style.display = 'block';
    }
  }

  function initAdminView() {
    document.getElementById('lockedArea').style.display = 'none';
    document.getElementById('appArea').style.display = 'block';
    document.getElementById('usersCard').style.display = 'block';
    loadUsers();
    var tryBind = setInterval(function () {
      if (window.sat1600PresenceChannel) {
        clearInterval(tryBind);
        var ch = window.sat1600PresenceChannel;
        ch.on('presence', { event: 'sync' }, renderPresence);
        renderPresence();
        pollTimer = setInterval(renderPresence, 5000);
      }
    }, 200);
  }

  function checkAccess() {
    var role = window.currentUserProfile ? window.currentUserProfile.role : null;
    if (window.currentAuthUser && role === 'super_admin') {
      initAdminView();
    } else {
      document.getElementById('lockedArea').style.display = 'block';
      document.getElementById('appArea').style.display = 'none';
      document.getElementById('usersCard').style.display = 'none';
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(checkAccess, 500);
    document.getElementById('userSearch').addEventListener('input', function () {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(applySearchFilter, 150);
    });
  });
  document.addEventListener('sat1600:authchange', checkAccess);
</script>
</body>
</html>
